services:
  mysql:
    image: mysql:8.0
    container_name: recruit_flow_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: recruit_flow
      MYSQL_USER: recruit_user
      MYSQL_PASSWORD: recruit_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: recruit_flow_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: recruit_flow_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      timeout: 20s
      retries: 10

  # milvus:
  #   image: milvusdb/milvus:latest
  #   container_name: recruit_flow_milvus
  #   environment:
  #     COMMON_STORAGETYPE: local
  #   ports:
  #     - "19530:19530"
  #     - "9091:9091"
  #   volumes:
  #     - milvus_data:/var/lib/milvus
  #   depends_on:
  #     - mysql
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
  #     timeout: 20s
  #     retries: 10
  # 注释说明: Milvus 在 T22-T27（RAG 对话）才需要，前期开发暂时跳过

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruit_flow_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: mysql+pymysql://recruit_user:recruit_password@mysql:3306/recruit_flow
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: recruit-flow
      MINIO_USE_SSL: "false"
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MILVUS_COLLECTION_NAME: recruit_kb
      EMBEDDING_DIM: "768"
      EMBEDDING_MODEL: bge-base-zh-v1.5
      SECRET_KEY: test-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      API_KEY: ${API_KEY:-}
      LLM_TIMEOUT_S: "60"
      LLM_MOCK: "1"
      DEBUG: "True"
      LOG_LEVEL: DEBUG
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # milvus 暂时跳过（T22-T27 才需要）
      # milvus:
      #   condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruit_flow_worker
    working_dir: /app
    command: python /app/worker/run_worker.py
    volumes:
      - .:/app
    environment:
      DATABASE_URL: mysql+pymysql://recruit_user:recruit_password@mysql:3306/recruit_flow
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: recruit-flow
      MINIO_USE_SSL: "false"
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MILVUS_COLLECTION_NAME: recruit_kb
      EMBEDDING_DIM: "768"
      EMBEDDING_MODEL: bge-base-zh-v1.5
      SECRET_KEY: test-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      API_KEY: ${API_KEY:-}
      LLM_TIMEOUT_S: "60"
      LLM_MOCK: "1"
      DEBUG: "True"
      LOG_LEVEL: DEBUG
    depends_on:
      - mysql
      - redis
      - minio
      # milvus 暂时跳过（T22-T27 才需要）
      # - milvus

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: recruit_flow_frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
  minio_data:
  # milvus_data:  # T22-T27 再启用
